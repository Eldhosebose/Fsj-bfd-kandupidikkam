<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Code Generator - FSJ Finder Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#7C3AED;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
h1{color:#7C3AED;font-size:22px;text-align:center;margin-bottom:8px}
p{color:#6b7280;font-size:14px;text-align:center;margin-bottom:20px}
input{width:100%;padding:13px;border:2px solid #E5E7EB;border-radius:10px;font-size:16px;margin-bottom:12px;text-transform:uppercase}
input:focus{outline:none;border-color:#7C3AED}
button{width:100%;padding:14px;background:#7C3AED;color:#fff;border:0;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;margin-bottom:10px}
button:hover{background:#6D28D9}
.result{background:#EDE9FE;border-radius:10px;padding:16px;text-align:center;margin-top:12px;display:none}
.result .code{font-size:22px;font-weight:800;color:#7C3AED;letter-spacing:2px;margin-bottom:10px;font-family:monospace}
.copyBtn{background:#fff;color:#7C3AED;border:2px solid #7C3AED;padding:10px 20px;border-radius:999px;font-weight:700;cursor:pointer;font-size:14px}
.history{margin-top:20px}
.history h3{font-size:14px;color:#6b7280;margin-bottom:8px}
.history .item{background:#F9FAFB;padding:10px;border-radius:8px;margin-bottom:6px;font-family:monospace;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.history .item .name{font-family:Arial;font-size:12px;color:#6b7280}
</style>
</head>
<body>
<div class="box">
<h1>🔑 Code Generator</h1>
<p>Generate unlock codes for buyers<br>Only you can access this page</p>
<input id="buyerName" type="text" placeholder="Buyer's name or phone (e.g. RAHUL)" maxlength="20"/>
<input id="prefix" type="text" placeholder="Prefix - 4 chars (e.g. A7B3)" maxlength="4"/>
<button onclick="generate()">Generate Code</button>
<div class="result" id="result">
<div class="code" id="codeDisplay"></div>
<button class="copyBtn" onclick="copyCode()">📋 Copy Code</button>
<a id="waShare" href="#" target="_blank" style="display:block;margin-top:10px;background:#25D366;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;text-align:center">📱 Send via WhatsApp</a>
</div>
<div class="history" id="history" style="display:none">
<h3>Generated codes (this device only)</h3>
<div id="historyList"></div>
</div>
</div>
<script>
function generateCode(prefix){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  prefix = (prefix || '').toUpperCase().replace(/[^A-Z0-9]/g, '').substring(0,4).padEnd(4, 'X');
  for(let attempt=0; attempt<100; attempt++){
    let suffix = '';
    for(let i=0; i<4; i++){ suffix += chars[Math.floor(Math.random() * chars.length)]; }
    const code = 'FSJ-' + prefix + '-' + suffix;
    let sum = 0;
    for(let i=4; i<code.length; i++){ const c = code[i]; if(c !== '-'){ sum += c.charCodeAt(0); } }
    if(sum % 7 === 0){ return code; }
  }
  return null;
}
let currentCode = '';
function generate(){
  const buyer = document.getElementById('buyerName').value.trim() || 'Buyer';
  let prefix = document.getElementById('prefix').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(!prefix){
    // Auto-generate prefix from buyer name
    prefix = buyer.substring(0,4).toUpperCase().replace(/[^A-Z0-9]/g, '').padEnd(4,'X');
  }
  const code = generateCode(prefix);
  if(code){
    currentCode = code;
    document.getElementById('codeDisplay').textContent = code;
    document.getElementById('result').style.display = 'block';
    document.getElementById('waShare').href = 'https://wa.me/?text=' + encodeURIComponent('Your FSJ Finder unlock code: ' + code + '\n\nEnter this on https://eldhosebose.github.io/Fsj-bfd-kandupidikkam/ to unlock all 596 contacts.');
    // Save to history
    saveToHistory(buyer, code);
  } else {
    alert('Could not generate code, try again');
  }
}
function copyCode(){
  navigator.clipboard.writeText(currentCode).then(()=>alert('Copied: ' + currentCode));
}
function saveToHistory(buyer, code){
  let h = JSON.parse(localStorage.getItem('fsj_gen_history') || '[]');
  h.unshift({buyer: buyer, code: code, date: new Date().toLocaleString()});
  if(h.length > 20) h = h.slice(0,20);
  localStorage.setItem('fsj_gen_history', JSON.stringify(h));
  renderHistory();
}
function renderHistory(){
  const h = JSON.parse(localStorage.getItem('fsj_gen_history') || '[]');
  if(h.length === 0) return;
  document.getElementById('history').style.display = 'block';
  document.getElementById('historyList').innerHTML = h.map(x => 
    '<div class="item"><span>' + x.code + '</span><span class="name">' + x.buyer + '<br>' + x.date + '</span></div>'
  ).join('');
}
renderHistory();
</script>
</body>
</html>
